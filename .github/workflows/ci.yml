name: ci

# Temporarily disabled: runs only on manual dispatch, not on push/PR.
on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libspdlog-dev libfmt-dev libgtest-dev libpcre2-dev

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build and test with xmake
        run: |
          xmake f -m release -y
          xmake build -y
          xmake test

      - name: Build and test with CMake
        run: |
          cmake -S . -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake
          ctest --test-dir build-cmake --output-on-failure

      - name: Build and test with sanitizers
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-asan
          ctest --test-dir build-asan --output-on-failure
